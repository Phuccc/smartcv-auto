<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Đăng nhập | SmartCV Auto</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#a54a0d",
                        sage: "#8da399",
                        terracotta: "#c66b56",
                        "warm-bg": "#F7F3E9"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    }
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 sm:p-10 relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full -mr-16 -mt-16"></div>
        
        <!-- Header -->
        <div class="flex flex-col items-center justify-center text-center mb-8 relative z-10">
            <div class="w-12 h-12 bg-primary/10 rounded-xl flex items-center justify-center text-primary mb-4 border border-primary/20">
                <span class="material-symbols-outlined font-variation-settings-FILL text-[28px]">flowsheet</span>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">SmartCV Auto</h1>
            <p class="text-slate-500 font-medium text-sm mt-1">Đăng nhập hệ thống quản trị nội bộ</p>
        </div>

        <!-- Form -->
        <form method="POST" action="/ui/auth/login" class="space-y-5" x-data="{ showPassword: false }">
            {% if error %}
            <div class="bg-red-50 text-red-600 px-4 py-3 rounded-lg text-sm font-bold border border-red-100 flex items-center gap-2">
                <span class="material-symbols-outlined flex-shrink-0 text-[18px]">error</span>
                {{ error }}
            </div>
            {% endif %}

            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-widest pl-1">Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">mail</span>
                    <input type="email" id="email" name="username" required 
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white transition-all text-sm font-medium"
                        placeholder="admin@company.com">
                </div>
            </div>

            <div class="space-y-1.5">
                <div class="flex items-center justify-between pl-1">
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-widest">Mật khẩu</label>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">lock</span>
                    <input :type="showPassword ? 'text' : 'password'" id="password" name="password" required 
                        class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white transition-all text-sm font-medium"
                        placeholder="••••••••">
                    <button type="button" @click="showPassword = !showPassword" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-slate-600 focus:outline-none rounded-lg hover:bg-slate-100 transition-colors">
                        <span class="material-symbols-outlined text-[18px]" x-text="showPassword ? 'visibility_off' : 'visibility'">visibility</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <div class="flex items-center gap-2 pl-1">
                    <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary/20 cursor-pointer">
                    <label for="remember" class="text-sm font-medium text-slate-600 cursor-pointer select-none">Ghi nhớ đăng nhập</label>
                </div>
                <a href="#" class="text-sm font-bold text-primary hover:text-terracotta transition-colors">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="w-full mt-2 py-3 px-4 text-white bg-primary hover:bg-[#8c3f0b] active:scale-[0.98] transition-all rounded-xl font-bold text-sm shadow-sm flex items-center justify-center gap-2 group">
                <span class="material-symbols-outlined text-[20px] group-hover:-translate-y-0.5 transition-transform">login</span>
                Đăng nhập hệ thống
            </button>
        </form>
    </div>

</body>
</html>
