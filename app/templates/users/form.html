<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4 transition-opacity" id="user-modal">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h3 class="font-bold text-slate-900 text-lg">
                {% if user %}Chỉnh sửa người dùng{% else %}Thêm người dùng mới{% endif %}
            </h3>
            <button onclick="document.getElementById('user-modal').remove()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200 transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6 overflow-y-auto">
            <form id="user-form" 
                  {% if user %}
                  hx-post="/ui/users/{{ user.id }}/update"
                  hx-target="#user-row-{{ user.id }}"
                  hx-swap="outerHTML"
                  {% else %}
                  hx-post="/ui/users"
                  hx-target="#users-tbody"
                  hx-swap="afterbegin"
                  {% endif %}
                  class="space-y-5"
                  hx-on::after-request="if(event.detail.successful) document.getElementById('user-modal').remove()">
                
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">Họ và tên <span class="text-red-500">*</span></label>
                    <input type="text" name="full_name" value="{{ user.full_name if user else '' }}" required
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-primary focus:ring-1 focus:ring-primary/20 outline-none transition-all placeholder-slate-400 font-medium"
                           placeholder="VD: Nguyễn Văn A">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">Email <span class="text-red-500">*</span></label>
                    <input type="email" name="email" value="{{ user.email if user else '' }}" required
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-primary focus:ring-1 focus:ring-primary/20 outline-none transition-all placeholder-slate-400 font-medium"
                           placeholder="VD: nguyenvena@company.com">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">Mật khẩu {% if not user %}<span class="text-red-500">*</span>{% endif %}</label>
                    <input type="password" name="password" {% if not user %}required{% endif %}
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-primary focus:ring-1 focus:ring-primary/20 outline-none transition-all placeholder-slate-400 font-medium"
                           placeholder="{% if user %}Bỏ trống nếu không muốn đổi{% else %}Nhập mật khẩu{% endif %}">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Vai trò <span class="text-red-500">*</span></label>
                        <select name="role" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-primary focus:ring-1 focus:ring-primary/20 outline-none transition-all font-medium text-slate-700">
                            {% for role in roles %}
                                {% set r_name = role.name if role is mapping else role.name %}
                                {% set r_disp = role.display_name if role is mapping else role.display_name %}
                                {% set is_selected = (user and user.role == r_name) %}
                                <option value="{{ r_name }}" {% if is_selected %}selected{% endif %}>
                                    {{ r_disp }} ({{ r_name }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Trạng thái</label>
                        <div class="flex items-center h-[42px] px-4 bg-slate-50 border border-slate-200 rounded-lg">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" name="is_active" value="true" class="sr-only peer" {% if not user or user.is_active %}checked{% endif %}>
                                <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary"></div>
                                <span class="ml-3 text-sm font-medium text-slate-700 peer-checked:text-primary">Hoạt động</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-100 mt-6">
                    <button type="button" onclick="document.getElementById('user-modal').remove()" class="px-5 py-2.5 rounded-lg text-slate-600 font-bold hover:bg-slate-100 transition-colors text-sm">
                        Hủy
                    </button>
                    <button type="submit" class="px-6 py-2.5 bg-primary text-white font-bold rounded-lg shadow-md shadow-primary/20 hover:bg-primary/90 transition-all text-sm active:scale-95 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[20px]">save</span>
                        Lưu thông tin
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
