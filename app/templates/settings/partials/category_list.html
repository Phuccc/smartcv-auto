<div class="p-6">
    <div class="flex flex-col md:flex-row gap-6 mb-8">
        <!-- Quick Add Form -->
        <div class="flex-1 p-5 bg-white rounded-2xl border border-slate-100 shadow-sm">
            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px]">add_circle</span>
                Thêm {{ title }} mới
            </h4>
            <form hx-post="/ui/categories/{{ category_type }}" 
                  hx-target="#category-content" 
                  class="flex gap-2">
                <div class="flex-1 relative">
                    <input type="text" name="name" required placeholder="Nhập tên {{ title }}..." 
                           class="w-full pl-4 pr-4 py-2 rounded-xl border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-bold transition-all">
                </div>
                <button type="submit" class="px-5 py-2 bg-primary text-white rounded-xl text-xs font-bold hover:shadow-lg hover:shadow-primary/20 transition-all flex items-center gap-2 shrink-0 active:scale-95">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                    Thêm
                </button>
            </form>
        </div>

        <!-- Search Bar -->
        <div class="w-full md:w-72 p-5 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm">
            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px]">search</span>
                Tìm kiếm {{ title }}
            </h4>
            <div class="relative">
                <input type="text" 
                       name="q" 
                       value="{{ q or '' }}"
                       placeholder="Tìm {{ title }}..."
                       hx-get="/ui/categories/{{ category_type }}"
                       hx-trigger="keyup changed delay:500ms"
                       hx-target="#category-content"
                       class="w-full pl-10 pr-4 py-2 rounded-xl border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium transition-all">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
            </div>
        </div>
    </div>

    <!-- Data Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3" id="category-grid-body">
        {% include "settings/partials/category_grid.html" %}
    </div>
</div>
