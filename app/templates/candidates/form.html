<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm transition-opacity" id="cand-modal-backdrop">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all flex flex-col max-h-[90vh]" @click.stop="">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50">
            <h3 class="text-lg font-bold text-slate-900">
                {% if candidate %}Chỉnh sửa hồ sơ: {{ candidate.full_name }}{% else %}Thêm ứng viên mới{% endif %}
            </h3>
            <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-lg hover:bg-slate-200">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        {% if candidate %}
        <form hx-post="/ui/candidates/{{ candidate.id }}/update" 
              hx-target="#cand-row-{{ candidate.id }}" 
              hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful && !event.detail.xhr.getResponseHeader('HX-Retarget') && event.target === this) document.getElementById('modal-container').innerHTML=''"
              class="flex flex-col overflow-hidden">
        {% else %}
        <form hx-post="/ui/candidates" 
              hx-encoding="multipart/form-data"
              hx-target="#candidates-table-body" 
              hx-swap="afterbegin"
              hx-target-400="#form-error"
              hx-on::after-request="if(event.detail.successful && !event.detail.xhr.getResponseHeader('HX-Retarget') && event.target === this) document.getElementById('modal-container').innerHTML=''"
              class="flex flex-col overflow-hidden">
        {% endif %}
            <div class="p-6 overflow-y-auto custom-scrollbar" style="max-height: calc(90vh - 140px);">
                <div id="form-error"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Họ và tên <span class="text-red-500">*</span></label>
                    <input type="text" name="full_name" value="{{ candidate.full_name if candidate else '' }}" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Chi nhánh <span class="text-red-500">*</span></label>
                    <select name="branch_id" 
                            hx-get="/ui/candidates/jobs-by-branch" 
                            hx-target="#job-positions-select" 
                            hx-swap="innerHTML"
                            hx-trigger="change"
                            class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                        <option value="">-- Chọn chi nhánh --</option>
                        {% for branch in branches %}
                        <option value="{{ branch.id }}" {% if candidate and candidate.job and candidate.job.branch_id == branch.id %}selected{% endif %}>{{ branch.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Vị trí ứng tuyển <span class="text-red-500">*</span></label>
                    <select id="job-positions-select" name="job_id" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                        {% if not candidate %}
                        <option value="">-- Vui lòng chọn chi nhánh trước --</option>
                        {% else %}
                        <option value="">-- Chọn công việc --</option>
                        {% for job in jobs %}
                            {% if candidate.job and candidate.job.branch_id == job.branch_id %}
                            <option value="{{ job.id }}" {% if candidate.job_id == job.id %}selected{% endif %}>{{ job.title }}</option>
                            {% endif %}
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>

                {% if candidate %}
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Email</label>
                    <input type="email" name="email" value="{{ candidate.email or '' }}" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Số điện thoại</label>
                    <input type="text" name="phone" value="{{ candidate.phone or '' }}" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Ngày sinh</label>
                    <input type="date" name="date_of_birth" value="{{ candidate.date_of_birth.strftime('%Y-%m-%d') if candidate.date_of_birth else '' }}" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Giới tính</label>
                    <select name="gender" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                        <option value="">-- Chọn giới tính --</option>
                        <option value="male" {% if candidate.gender == 'male' %}selected{% endif %}>Nam</option>
                        <option value="female" {% if candidate.gender == 'female' %}selected{% endif %}>Nữ</option>
                        <option value="other" {% if candidate.gender == 'other' %}selected{% endif %}>Khác</option>
                    </select>
                </div>

                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Facebook</label>
                    <input type="url" name="facebook" value="{{ candidate.facebook or '' }}" placeholder="https://facebook.com/..." class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Địa chỉ</label>
                    <input type="text" name="specific_address" value="{{ candidate.specific_address or '' }}" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">CV Link</label>
                    <input type="url" name="cv_link" value="{{ candidate.cv_link or '' }}" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Portfolio Link</label>
                    <input type="url" name="portfolio_link" value="{{ candidate.portfolio_link or '' }}" class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                
                {% else %}

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2 text-center pt-2 border-t border-slate-100 mt-2">Tài liệu hồ sơ</label>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Tài liệu / CV (File) <span class="text-red-500">*</span></label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-200 border-dashed rounded-xl hover:border-primary/50 transition-colors bg-slate-50/50">
                        <div class="space-y-1 text-center">
                            <span class="material-symbols-outlined text-4xl text-slate-400 mb-2">cloud_upload</span>
                            <div class="flex text-sm text-slate-600">
                                <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-primary hover:text-primary-dark focus-within:outline-none">
                                    <span>Tải tệp lên</span>
                                    <input id="file-upload" name="cv_file" type="file" class="sr-only">
                                </label>
                                <p class="pl-1">hoặc kéo thả vào đây</p>
                            </div>
                            <p class="text-xs text-slate-500">PDF</p>
                            <div id="file-name" class="text-xs font-bold text-primary mt-2"></div>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Webhook URL <span class="text-slate-400 font-normal italic">(Mặc định n8n)</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <span class="material-symbols-outlined text-sm">link</span>
                        </span>
                        <input type="url" name="webhook_url" value="{{ webhook_url }}" class="w-full pl-10 pr-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-xs font-mono">
                    </div>
                </div>
                {% endif %}
            </div>

            <script>
                document.getElementById('file-upload').addEventListener('change', function(e) {
                    const fileName = e.target.files[0]?.name || '';
                    document.getElementById('file-name').textContent = fileName ? 'Đã chọn: ' + fileName : '';
                });
            </script>
            
            </div>
            
            <div class="px-6 py-4 flex items-center justify-end gap-3 border-t border-slate-100 bg-slate-50">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 font-bold hover:bg-slate-200 transition-colors text-sm bg-white">
                    Hủy bỏ
                </button>
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-primary text-white font-bold hover:shadow-lg hover:shadow-primary/25 transition-all active:scale-95 text-sm flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="material-symbols-outlined text-[18px] htmx-indicator animate-spin">sync</span>
                    <span class="material-symbols-outlined text-[18px] htmx-indicator-none">save</span>
                    Lưu hồ sơ
                </button>
            </div>
        </form>
    </div>
</div>
