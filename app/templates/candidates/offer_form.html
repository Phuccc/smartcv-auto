<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm transition-opacity" id="offer-modal-backdrop">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg transform transition-all" @click.stop="">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50 rounded-t-2xl">
            <h3 class="text-lg font-bold text-slate-900">
                Gửi Đề nghị tuyển dụng (Offer)
            </h3>
            <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-lg hover:bg-slate-200">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <form hx-post="/ui/candidates/{{ candidate_id }}/offer" 
              class="p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Ngày nhận việc <span class="text-red-500">*</span></label>
                    <input type="date" name="start_date" required class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Thời gian làm việc <span class="text-red-500">*</span></label>
                    <input type="text" name="work_time" placeholder="VD: 8h00 - 17h00 (T2 - T6)" required class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Mức lương <span class="text-red-500">*</span></label>
                    <input type="text" name="salary" placeholder="VD: 15.000.000 VNĐ" required class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Địa điểm làm việc <span class="text-red-500">*</span></label>
                    <input type="text" name="work_location" placeholder="VD: Tòa nhà CMC, Cầu Giấy, Hà Nội" required class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Webhook URL <span class="text-red-500">*</span></label>
                    <input type="url" name="webhook_url" value="{{ webhook_url }}" required class="w-full px-4 py-2.5 rounded-lg border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium">
                </div>
            </div>
            
            <div class="mt-8 flex items-center justify-end gap-3 pt-5 border-t border-slate-100">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 transition-colors text-sm">
                    Hủy bỏ
                </button>
                <button type="submit" onclick="this.innerHTML='<span class=\'material-symbols-outlined text-[18px] animate-spin\'>sync</span> Đang gửi...';" class="px-5 py-2.5 rounded-lg bg-green-600 text-white font-bold hover:shadow-lg hover:shadow-green-600/25 transition-all active:scale-95 text-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">send</span>
                    Gửi Offer
                </button>
            </div>
        </form>
    </div>
</div>
