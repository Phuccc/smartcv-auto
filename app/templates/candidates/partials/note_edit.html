<div class="bg-white p-4 rounded-xl border-2 border-primary/20 shadow-sm" id="note-{{ note.id }}">
    <form hx-post="/ui/candidates/notes/{{ note.id }}/update" 
          hx-target="#note-{{ note.id }}" 
          hx-swap="outerHTML">
        <textarea name="content" 
                  rows="3" 
                  class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-700 outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all mb-3">{{ note.content }}</textarea>
        <div class="flex justify-end gap-2">
            <button type="button" 
                    hx-get="/ui/candidates/notes/{{ note.id }}/item" 
                    hx-target="#note-{{ note.id }}" 
                    hx-swap="outerHTML"
                    class="px-3 py-1.5 text-[10px] font-bold text-slate-500 hover:bg-slate-100 rounded-lg transition-colors">
                Hủy
            </button>
            <button type="submit" 
                    class="px-3 py-1.5 text-[10px] font-bold bg-primary text-white rounded-lg shadow-sm hover:scale-105 transition-all">
                Lưu thay đổi
            </button>
        </div>
    </form>
</div>
