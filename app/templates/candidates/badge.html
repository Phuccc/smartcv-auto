{% if status == 'mới' %}
<span id="candidate-status-badge{% if candidate_id %}-{{ candidate_id }}{% endif %}" class="inline-flex items-center px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-[10px] font-black border border-blue-100 uppercase tracking-tight">Mới</span>
{% elif status == 'duyệt' %}
<span id="candidate-status-badge{% if candidate_id %}-{{ candidate_id }}{% endif %}" class="inline-flex items-center px-2.5 py-1 rounded-full bg-green-50 text-green-700 text-[10px] font-black border border-green-100 uppercase tracking-tight">Đã duyệt</span>

{% elif status == 'phỏng vấn' %}
<span id="candidate-status-badge{% if candidate_id %}-{{ candidate_id }}{% endif %}" class="inline-flex items-center px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-600 text-[10px] font-black border border-indigo-100 uppercase tracking-tight">Phỏng vấn</span>
{% elif status == 'gửi offer' %}
<span id="candidate-status-badge{% if candidate_id %}-{{ candidate_id }}{% endif %}" class="inline-flex items-center px-2.5 py-1 rounded-full bg-purple-50 text-purple-700 text-[10px] font-black border border-purple-100 uppercase tracking-tight">Gửi Offer</span>
{% elif status == 'đã tuyển' %}
<span id="candidate-status-badge{% if candidate_id %}-{{ candidate_id }}{% endif %}" class="inline-flex items-center px-2.5 py-1 rounded-full bg-teal-50 text-teal-700 text-[10px] font-black border border-teal-100 uppercase tracking-tight">Đã nhận việc</span>
{% elif status == 'từ chối' %}
<span id="candidate-status-badge{% if candidate_id %}-{{ candidate_id }}{% endif %}" class="inline-flex items-center px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 text-[10px] font-black border border-slate-200 uppercase tracking-tight">Từ chối</span>
{% else %}
<span id="candidate-status-badge{% if candidate_id %}-{{ candidate_id }}{% endif %}" class="inline-flex items-center px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-[10px] font-black border border-slate-200 uppercase tracking-tight">{{ status }}</span>
{% endif %}
